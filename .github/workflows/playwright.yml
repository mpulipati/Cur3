name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  session:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chrome
      run: npx playwright install --with-deps chrome
    - name: Open Blogger in headed Chrome
      run: xvfb-run --auto-servernum npx playwright test --project=setup
    - name: Upload Blogger session
      uses: actions/upload-artifact@v4
      with:
        name: blogspot-session
        path: playwright/.auth/blogspot.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 1

  test:
    timeout-minutes: 60
    needs: session
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    env:
      BLOGSPOT_STORAGE: playwright/.auth/blogspot.json
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Chrome
      run: npx playwright install --with-deps chrome
    - name: Download Blogger session
      uses: actions/download-artifact@v4
      with:
        name: blogspot-session
        path: playwright/.auth
    - name: Run Playwright tests
      run: xvfb-run --auto-servernum npx playwright test --headed --project=chromium --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    - name: Upload blob report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: blob-report-${{ matrix.shardIndex }}
        path: blob-report
        if-no-files-found: ignore
        retention-days: 1

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v6
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Download blob reports
      uses: actions/download-artifact@v4
      with:
        path: all-blob-reports
        pattern: blob-report-*
        merge-multiple: true
    - name: Merge blob reports into HTML
      run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
    - name: Upload merged HTML report
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
